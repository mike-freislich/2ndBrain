# Nanisca activity manifest (TOML form).
# Identifier: n_counting_lines
#
# Convention: `audio` and `sceneDirection` values are KEYS into the [strings] table,
# not literal text. The JSON manifest remains the source of truth.

specVersion = "1.1-DRAFT"
locale      = "en-ZA"
instructionalHints = ["nh_counting_items_target"]

[meta]
identifier = "n_counting_lines"
title = "Counting Lines"
subject = "Numeracy"
subconstructs = ["Counting"]
skillsMapping = ["N1.1.1-F"]
activityFamily = "Interactive - Tap"
activityType = "Tap to select answer with audio clue"
description = "Count, compare and choose the correct number of items in a line out of 2–3 options according to audio."

[meta.suggestedGlobalParams]
showDemo = true
showIntro = true
showOutro = true

# ─── Novel Parameters ─────────────────────────────────────────────

[novelParams.beadsPerLine]
type = "integerRange"
logic = "Lines must never have the same number of items."

[novelParams.beadsPerLine.levels]
L1 = { min = 1, max = 5 }
L2 = { min = 1, max = 5 }
L3 = { min = 2, max = 10 }
L4 = { min = 2, max = 10 }
L5 = { min = 2, max = 10 }

[novelParams.numberOfLines]
type = "integer"

[novelParams.numberOfLines.levels]
L1 = 2
L2 = 3
L3 = 3
L4 = 3
L5 = 3

[novelParams.shapeUniformity]
type = "string"
enum = ["single", "mixed"]
logic = "Per line."

[novelParams.shapeUniformity.levels]
L1 = "single"
L2 = "single"
L3 = "single"
L4 = "single"
L5 = "mixed"

[novelParams.sizeUniformity]
type = "string"
enum = ["single", "mixed"]
logic = "Per line."

[novelParams.sizeUniformity.levels]
L1 = "single"
L2 = "single"
L3 = "single"
L4 = "mixed"
L5 = "single"

[novelParams.spacingUniformity]
type = "string"
enum = ["consistent", "varied"]
logic = "Per line."

[novelParams.spacingUniformity.levels]
L1 = "consistent"
L2 = "consistent"
L3 = "varied"
L4 = "consistent"
L5 = "varied"

[novelParams.requiredTouchCount]
type = "boolean"
logic = "When true, learners must touch and count every item on every line before selecting. Touched items reduce lightness by 20% with SFX."

[novelParams.requiredTouchCount.levels]
L1 = true
L2 = true
L3 = false
L4 = false
L5 = false

[novelParams.feedbackTiming]
type = "string"
enum = ["instant", "delayed"]
logic = "Instant: as soon as item is tapped, if incorrect the line goes 50% transparent with incorrect SFX. Delayed: feedback only after check button."

[novelParams.feedbackTiming.levels]
L1 = "instant"
L2 = "instant"
L3 = "delayed"
L4 = "delayed"
L5 = "delayed"

# ─── Action Sequence ──────────────────────────────────────────────

[[actionSequence.core]]
phase    = "intro"
step     = 1
required = false
actions  = ["character_enters"]
audio    = "intro_prompt"

[[actionSequence.core]]
phase    = "demo"
step     = 1
required = false
actions  = ["lines_appear_with_items_centered"]
audio    = "demo_tap_count_instruction"
sfx      = "bead_slide"

[[actionSequence.core]]
phase    = "demo"
step     = 2
required = false
actions  = ["pointer_counts_line_1", "pointer_counts_line_2", "pointer_counts_line_3"]
audio    = ["demo_count_line_1", "demo_count_line_2", "demo_count_line_3"]
sfx      = "bead_click"

[[actionSequence.core]]
phase    = "demo"
step     = 3
required = false
condition = "all_items_touched"
actions  = ["item_lightness_reduced_per_touch"]
audio    = "demo_click_target_line"
sfx      = "success_chime"

[[actionSequence.core]]
phase    = "demo"
step     = 4
required = false
condition = "correct_selection"
actions  = ["number_appears_right"]
audio    = "demo_confirm_count"
sfx      = "pop_appear"

[[actionSequence.core]]
phase    = "main"
step     = 1
required = true
repeat   = "numberOfRounds"
variant  = "touch_count_required"
condition = "requiredTouchCount == true"
actions  = ["lines_appear", "audio_target_prompt"]
audio    = "main_count_choose"
sfx      = "bead_slide"

[[actionSequence.core]]
phase    = "main"
step     = 2
required = true
variant  = "touch_count_required"
condition = "requiredTouchCount == true"
actions  = ["learner_touches_each_item", "item_lightness_reduced_per_touch"]
sfx      = "bead_click"

[[actionSequence.core]]
phase    = "main"
step     = 3
required = true
variant  = "touch_count_required"
condition = "feedbackTiming == instant"
actions  = ["incorrect_line_50pc_transparent_on_incorrect_tap"]
audio    = "main_confirm_count"
sfx      = "success_chime"

[[actionSequence.core]]
phase    = "main"
step     = 4
required = true
variant  = "check_button_required"
condition = "requiredTouchCount == false"
actions  = ["check_button_displayed"]
audio    = "main_choose_then_check"

[[actionSequence.core]]
phase    = "main"
step     = 5
required = true
variant  = "check_button_required"
condition = "requiredTouchCount == false"
actions  = ["learner_selects_line", "learner_taps_check"]

[[actionSequence.core]]
phase    = "main"
step     = 6
required = true
variant  = "check_button_required"
condition = "feedbackTiming == delayed"
actions  = ["correct_or_incorrect_effect_and_sfx", "incorrect_line_50pc_transparent"]
audio    = "main_confirm_count"

[[actionSequence.core]]
phase    = "outro"
step     = 1
required = false
actions  = ["character_appears"]
audio    = "outro_celebration"
sfx      = "fanfare"

# ─── Strings ──────────────────────────────────────────────────────
# All localisable text. Placeholders use {name} syntax resolved at runtime.

[strings]
intro_prompt               = "Can you help {object_character} select the {object} with the correct number of {items}?"
demo_tap_count_instruction = "Tap each {item} to count how many {items} are on each {object}."
demo_count_line_1          = "{num_items_line_1} {object} 1."
demo_count_line_2          = "{num_items_line_2} {object} 2."
demo_count_line_3          = "{num_items_line_3} {object} 3."
demo_click_target_line     = "Click on the {object} with {num_items} {items}."
demo_confirm_count         = "There are {num_items} {items} on this {object}."
main_count_choose          = "Count the {items} and then choose the {object} with {num_items} {items}."
main_confirm_count         = "There are {num_items} {items}."
main_choose_then_check     = "Choose the {object} with {num_items} {items} and then click the check mark when you're done."
outro_celebration          = "Good job!"

# ─── Characters ───────────────────────────────────────────────────

[characters.object_character_rapelang]
name        = "Rapelang"
role        = "protagonist"
description = "Helper character used in the necklace/string contextualisation"

